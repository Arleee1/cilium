# For a new, ztunnel-only Helm release with operator-owned static registration.
# Existing releases require a bootstrap ownership handoff and trust review.
# Prerequisites: the existing cilium-ztunnel-secrets Secret in the Cilium
# namespace, spire-upstream-ca (tls.crt/tls.key) in cilium-spire, a suitable
# default StorageClass, and at least two schedulable Linux nodes.
encryption:
  enabled: true
  type: ztunnel
  ztunnel:
    ca:
      type: spire
    spire:
      className: cilium-spire
authentication:
  mutual:
    spire:
      enabled: true
      trustDomain: spiffe.cilium
      ha:
        enabled: true
        replicas: 2
      install:
        enabled: true
        namespace: cilium-spire
        existingNamespace: true
