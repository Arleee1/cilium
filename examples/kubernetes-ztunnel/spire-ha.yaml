#
# For a new, ztunnel-only Helm release with CRD registration.
# Keep bootstrapProfile=legacy if other consumers need Cilium SPIRE identities.
# Existing releases must preinstall the CRD and plan the trust migration.
# Prerequisites: the existing cilium-ztunnel-secrets Secret in the Cilium
# namespace, spire-upstream-ca (tls.crt/tls.key) in cilium-spire, a suitable
# default StorageClass, and at least two schedulable Linux nodes.
encryption:
  enabled: true
  type: ztunnel
  ztunnel:
    ca:
      type: spire
    spire:
      useCRD: true
      bootstrapProfile: ztunnel
      className: cilium-spire
authentication:
  mutual:
    spire:
      enabled: true
      trustDomain: spiffe.cilium
      install:
        enabled: true
        namespace: cilium-spire
        existingNamespace: true
        server:
          replicas: 2
