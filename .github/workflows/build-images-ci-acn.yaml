name: ACN Image CI Build

# Any change in triggers needs to be reflected in the concurrency group.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev/*
      - release/*
  push:
    branches:
    - dev/*
    - release/*

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read
  # Required to generate OIDC tokens for `sigstore/cosign-installer` authentication
  id-token: write
  ### ACN CHANGE ###
  # Required for gh cli to trigger other workflows
  actions: write
  # Required for dorny/paths-filter to list PR changed files
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.after }}
  cancel-in-progress: true

jobs:
  check-base-changes:
    name: Check for base image changes
    runs-on: ubuntu-24.04
    outputs:
      base-images-changed: ${{ steps.filter.outputs.base-images }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        if: github.event_name == 'pull_request'
        id: filter
        with:
          # Same paths as build-images-base-acn.yaml triggers
          filters: |
            base-images:
              - 'images/runtime/**'
              - 'images/builder/**'
              - 'images/distroless/runtime/**'
              - 'images/distroless/builder/**'
              - 'images/Makefile.acn'
              - 'images/scripts/acn-build-image.sh'

      - name: Detect base image changes (push)
        if: github.event_name == 'push'
        id: filter-push
        run: |
          # For push events, check if the commit changed base image paths
          changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- \
            'images/runtime/' \
            'images/builder/' \
            'images/distroless/runtime/' \
            'images/distroless/builder/' \
            'images/Makefile.acn' \
            'images/scripts/acn-build-image.sh' 2>/dev/null | head -1)
          if [ -n "$changed" ]; then
            echo "base-images=true" >> $GITHUB_OUTPUT
          else
            echo "base-images=false" >> $GITHUB_OUTPUT
          fi

  setup:
    name: Setup Build Args
    runs-on: ubuntu-24.04
    needs: check-base-changes
    outputs:
      golang-image: ${{ steps.images.outputs.golang-image }}
      alpine-image: ${{ steps.images.outputs.alpine-image }}
      cilium-builder-image: ${{ steps.images.outputs.cilium-builder-image }}
      cilium-runtime-image: ${{ steps.images.outputs.cilium-runtime-image }}
      distroless-cilium-builder-image: ${{ steps.images.outputs.distroless-cilium-builder-image }}
      distroless-cilium-runtime-image: ${{ steps.images.outputs.distroless-cilium-runtime-image }}
      fips-base-image: ${{ steps.images.outputs.fips-base-image }}
      quay-organization-dev: ${{ steps.images.outputs.quay-organization-dev }}
      base-images-changed: ${{ needs.check-base-changes.outputs.base-images-changed }}
      modifiers: ${{ steps.images.outputs.modifiers }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.context-ref || github.sha }}
          persist-credentials: false

      - name: Compute image references
        id: images
        shell: bash
        run: |
          # Golang — extract from Makefile.acn (single source of truth for MCR Go fork)
          golang_image=$(grep -m1 '^GOLANG_IMAGE ?=' ./images/Makefile.acn | sed 's/^GOLANG_IMAGE ?= *//')
          echo "golang-image=${golang_image}" >> $GITHUB_OUTPUT

          # Alpine — extract version from operator Dockerfile, rewrite to ACR
          alpine_raw=$(grep -m1 'ARG ALPINE_IMAGE' ./images/operator/Dockerfile | cut -d= -f2)
          alpine_version=${alpine_raw#*:}
          alpine_version=${alpine_version%@*}
          alpine_image="acnpublic.azurecr.io/alpine:${alpine_version}"
          echo "alpine-image=${alpine_image}" >> $GITHUB_OUTPUT

          # FIPS base image (single source of truth: Makefile.acn)
          fips_base_image=$(grep -m1 '^BASE_IMAGE ?=' ./images/Makefile.acn | sed 's/^BASE_IMAGE ?= *//')
          echo "fips-base-image=${fips_base_image}" >> $GITHUB_OUTPUT

          # Distroless builder/runtime (single source of truth: Makefile.acn)
          distroless_cilium_runtime_image=$(make -C images -f Makefile.acn --no-print-directory ACN_REGISTRIES=acnpublic.azurecr.io/cilium print-acn-distroless-runtime-image)
          echo "distroless-cilium-runtime-image=${distroless_cilium_runtime_image}" >> $GITHUB_OUTPUT

          distroless_cilium_builder_image=$(make -C images -f Makefile.acn --no-print-directory ACN_REGISTRIES=acnpublic.azurecr.io/cilium print-acn-distroless-builder-image)
          echo "distroless-cilium-builder-image=${distroless_cilium_builder_image}" >> $GITHUB_OUTPUT

          # Non-distroless builder/runtime (single source of truth: Makefile.acn)
          cilium_builder_image=$(make -C images -f Makefile.acn --no-print-directory ACN_REGISTRIES=acnpublic.azurecr.io/cilium print-acn-builder-image)
          echo "cilium-builder-image=${cilium_builder_image}" >> $GITHUB_OUTPUT

          cilium_runtime_image=$(make -C images -f Makefile.acn --no-print-directory ACN_REGISTRIES=acnpublic.azurecr.io/cilium print-acn-runtime-image)
          echo "cilium-runtime-image=${cilium_runtime_image}" >> $GITHUB_OUTPUT

          # Organization
          echo "quay-organization-dev=cilium" >> $GITHUB_OUTPUT

          # Default MODIFIERS matching Makefile.docker, with GOEXPERIMENT for MCR Go.
          echo "modifiers=GOEXPERIMENT=ms_nocgo_opensslcrypto" >> $GITHUB_OUTPUT

          echo "Golang image: ${golang_image}"
          echo "Alpine image: ${alpine_image}"
          echo "FIPS base image: ${fips_base_image}"
          echo "Cilium builder image: ${cilium_builder_image}"
          echo "Cilium runtime image: ${cilium_runtime_image}"
          echo "Distroless Cilium builder image: ${distroless_cilium_builder_image}"
          echo "Distroless Cilium runtime image: ${distroless_cilium_runtime_image}"

  wait-for-base-images:
    name: Wait for base images in ACR
    needs: setup
    if: needs.setup.outputs.base-images-changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_BUILD_SUBSCRIPTION_ID }}

      - name: ACR Login
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if az acr login -n acnpublic.azurecr.io \
              && az acr check-health -n acnpublic.azurecr.io --yes; then
              echo "ACR login validated on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::ACR login/health check failed (attempt ${attempt}/${max_attempts})"
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_s=$((attempt * 10))
              echo "Retrying in ${sleep_s}s..."
              sleep "$sleep_s"
            fi
          done
          echo "::error::ACR login failed after ${max_attempts} attempts"
          exit 1

      - name: Wait for base images to be available
        shell: bash
        env:
          BUILDER: ${{ needs.setup.outputs.cilium-builder-image }}
          RUNTIME: ${{ needs.setup.outputs.cilium-runtime-image }}
          DISTROLESS_BUILDER: ${{ needs.setup.outputs.distroless-cilium-builder-image }}
          DISTROLESS_RUNTIME: ${{ needs.setup.outputs.distroless-cilium-runtime-image }}
        run: |
          # Wait for all base images built by build-images-base-acn.yaml
          images=("${RUNTIME}" "${BUILDER}" "${DISTROLESS_RUNTIME}" "${DISTROLESS_BUILDER}")

          poll_interval=30
          max_attempts=120  # 60 minutes at 30s intervals

          for image in "${images[@]}"; do
            echo "⏳ Waiting for image: ${image}"
            attempt=0
            while [[ $attempt -lt $max_attempts ]]; do
              attempt=$((attempt + 1))
              if docker manifest inspect "${image}" > /dev/null 2>&1; then
                echo "✅ Image available: ${image}"
                break
              fi
              if [[ $attempt -ge $max_attempts ]]; then
                echo "❌ Timeout waiting for image: ${image}"
                exit 1
              fi
              echo "  Attempt ${attempt}/${max_attempts} — not yet available, retrying in ${poll_interval}s..."
              sleep "${poll_interval}"
            done
          done
          echo "✅ All required base images are available in ACR"

  build-and-push-prs:
    timeout-minutes: 45
    name: Build and Push Images
    runs-on: ubuntu-24.04
    needs: [setup, wait-for-base-images]
    if: always() && needs.setup.result == 'success' && (needs.wait-for-base-images.result == 'success' || needs.wait-for-base-images.result == 'skipped')
    strategy:
      matrix:
        include:
          - name: cilium
            dockerfile: ./images/cilium/Dockerfile
            platforms: linux/amd64,linux/arm64
            cilium-builder-override: true
            cilium-runtime-override: true

          - name: operator-aws
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            cilium-builder-override: true
            golang-override: true
            alpine-override: true
            fips-base-image: true

          - name: operator-azure
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            cilium-builder-override: true
            golang-override: true
            alpine-override: true
            fips-base-image: true

          - name: operator-alibabacloud
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            cilium-builder-override: true
            golang-override: true
            alpine-override: true
            fips-base-image: true

          - name: operator-generic
            dockerfile: ./images/operator/Dockerfile
            platforms: linux/amd64,linux/arm64
            cilium-builder-override: true
            golang-override: true
            alpine-override: true
            fips-base-image: true

          - name: hubble-relay
            dockerfile: ./images/hubble-relay/Dockerfile
            platforms: linux/amd64,linux/arm64
            cilium-builder-override: true
            golang-override: true
            fips-base-image: true

          - name: clustermesh-apiserver
            dockerfile: ./images/clustermesh-apiserver/Dockerfile
            platforms: linux/amd64,linux/arm64
            golang-override: true
            fips-base-image: true

          - name: docker-plugin
            dockerfile: ./images/cilium-docker-plugin/Dockerfile
            platforms: linux/amd64,linux/arm64
            golang-override: true
            fips-base-image: true

          # Add SDP image once in branch

    steps:
      - name: Checkout source (trusted)
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Cleanup Disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0
        with:
          driver-opts: |
            image=mcr.microsoft.com/oss/moby/buildkit:0.11.6-2

      - name: Getting image tag
        id: tag
        run: |
          # Replace ${{ github.event.repository.default_branch }} locations with direct reference as pforks default is not correct. We need upstream/main

          if [ "${{ github.event.pull_request.head.sha }}" != "" ]; then
            sha=${{ github.event.pull_request.head.sha }}
          else
            sha=${{ github.sha }}
          fi
          echo sha=${sha} >> $GITHUB_OUTPUT

          tag=${sha}
          echo tag=${tag} >> $GITHUB_OUTPUT

          if [[ "${{ github.event_name == 'push' }}" == "true" ]]; then
            if [[ "${{ github.ref_name }}" == "upstream/main" ]]; then
              floating_tag=latest
            else
              floating_tag="${{ github.ref_name }}"
              # Remove slashes from branch names
              floating_tag=${floating_tag##*/}
            fi
            echo floating_tag=${floating_tag} >> $GITHUB_OUTPUT
          fi

          normal_tag="acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${tag}"
          race_tag="${normal_tag}-race"
          unstripped_tag="${normal_tag}-unstripped"

          if [ -n "${floating_tag}" ]; then
            floating_normal_tag="acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${floating_tag}"
            normal_tag="${normal_tag},${floating_normal_tag}"
          fi

          if [[ "${{ github.event_name }}" == 'merge_group' || "${{ github.event_name }}" == 'push' ]]; then
            # Don't build race and unstripped images for merge_group or push events.
            race_tag=""
            unstripped_tag=""
          fi

          echo normal_tag=${normal_tag} >> $GITHUB_OUTPUT
          echo race_tag=${race_tag} >> $GITHUB_OUTPUT
          echo unstripped_tag=${unstripped_tag} >> $GITHUB_OUTPUT

      # Warning: since this is a privileged workflow, subsequent workflow job
      # steps must take care not to execute untrusted code.
      - name: Checkout pull request branch (NOT TRUSTED)
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set image override args
        id: overrides
        shell: bash
        run: |
          {
            echo 'args<<EOF'
            if [[ "${{ matrix.golang-override }}" == "true" ]]; then
              echo "GOLANG_IMAGE=${{ needs.setup.outputs.golang-image }}"
            fi
            if [[ "${{ matrix.alpine-override }}" == "true" ]]; then
              echo "ALPINE_IMAGE=${{ needs.setup.outputs.alpine-image }}"
            fi
            if [[ "${{ matrix.cilium-builder-override }}" == "true" ]]; then
              echo "CILIUM_BUILDER_IMAGE=${{ needs.setup.outputs.distroless-cilium-builder-image }}"
            fi
            if [[ "${{ matrix.cilium-runtime-override }}" == "true" ]]; then
              echo "CILIUM_RUNTIME_IMAGE=${{ needs.setup.outputs.cilium-runtime-image }}"
            fi
            if [[ "${{ matrix.fips-base-image }}" == "true" ]]; then
              echo "BASE_IMAGE=${{ needs.setup.outputs.fips-base-image }}"
            fi
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_BUILD_SUBSCRIPTION_ID }}

      - name: acr login
        shell: bash
        run: |
          set -uo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            if az acr login -n acnpublic.azurecr.io \
              && az acr check-health -n acnpublic.azurecr.io --yes; then
              echo "ACR login validated on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::ACR login/health check failed (attempt ${attempt}/${max_attempts})"
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_s=$((attempt * 10))
              echo "Retrying in ${sleep_s}s..."
              sleep "$sleep_s"
            fi
          done
          echo "::error::ACR login failed after ${max_attempts} attempts"
          exit 1

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Install Bom
        shell: bash
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/bom
          BOM_VERSION: v0.6.0
        run: |
          curl -L https://github.com/kubernetes-sigs/bom/releases/download/${{ env.BOM_VERSION }}/bom-amd64-linux -o bom
          sudo mv ./bom /usr/local/bin/bom
          sudo chmod +x /usr/local/bin/bom

      - name: CI Build ${{ matrix.name }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: docker_build_ci
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: ${{ matrix.platforms }}
          tags: ${{ steps.tag.outputs.normal_tag }}
          target: release
          build-args: |
            MODIFIERS="${{ needs.setup.outputs.modifiers }}"
            OPERATOR_VARIANT=${{ matrix.name }}
            ${{ steps.overrides.outputs.args }}

      - name: CI race detection Build ${{ matrix.name }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: docker_build_ci_detect_race_condition
        if: ${{ steps.tag.outputs.race_tag != '' }}
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.race_tag }}
          target: release
          build-args: |
            BASE_IMAGE=${{ needs.setup.outputs.cilium-runtime-image }}
            MODIFIERS="${{ needs.setup.outputs.modifiers }} LOCKDEBUG=1 RACE=1"
            OPERATOR_VARIANT=${{ matrix.name }}
            ${{ steps.overrides.outputs.args }}

      - name: CI Unstripped Binaries Build ${{ matrix.name }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        id: docker_build_ci_unstripped
        if: ${{ steps.tag.outputs.unstripped_tag != '' }}
        with:
          provenance: false
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tag.outputs.unstripped_tag }}
          target: release
          build-args: |
            MODIFIERS="${{ needs.setup.outputs.modifiers }} NOSTRIP=1"
            OPERATOR_VARIANT=${{ matrix.name }}
            ${{ steps.overrides.outputs.args }}

      - name: Sign Container Images
        run: |
          cosign sign -y acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci.outputs.digest }}
          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            cosign sign -y acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_detect_race_condition.outputs.digest }}
          fi
          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            cosign sign -y acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_unstripped.outputs.digest }}
          fi

      - name: Generate SBOM
        shell: bash
        # To-Do: generate SBOM from source after https://github.com/kubernetes-sigs/bom/issues/202 is fixed
        # To-Do: format SBOM output to json after cosign v2.0 is released with https://github.com/sigstore/cosign/pull/2479
        run: |
          bom generate -o sbom_ci_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx \
          --image=acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}
          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            bom generate -o sbom_ci_race_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx \
            --image=acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-race
          fi
          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            bom generate -o sbom_ci_unstripped_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx \
            --image=acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-unstripped
          fi

      - name: Attach SBOM to Container Images
        run: |
          cosign attach sbom --sbom sbom_ci_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci.outputs.digest }}
          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            cosign attach sbom --sbom sbom_ci_race_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_detect_race_condition.outputs.digest }}
          fi
          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            cosign attach sbom --sbom sbom_ci_unstripped_${{ matrix.name }}_${{ steps.tag.outputs.tag }}.spdx acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${{ steps.docker_build_ci_unstripped.outputs.digest }}
          fi

      - name: Sign SBOM Images
        run: |
          docker_build_ci_digest="${{ steps.docker_build_ci.outputs.digest }}"
          image_name="acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${docker_build_ci_digest/:/-}.sbom"
          docker_build_ci_sbom_digest="sha256:$(docker buildx imagetools inspect --raw ${image_name} | sha256sum | head -c 64)"
          cosign sign -y "acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${docker_build_ci_sbom_digest}"

          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            docker_build_ci_detect_race_condition_digest="${{ steps.docker_build_ci_detect_race_condition.outputs.digest }}"
            image_name="acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${docker_build_ci_detect_race_condition_digest/:/-}.sbom"
            docker_build_ci_detect_race_condition_sbom_digest="sha256:$(docker buildx imagetools inspect --raw ${image_name} | sha256sum | head -c 64)"
            cosign sign -y "acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${docker_build_ci_detect_race_condition_sbom_digest}"
          fi

          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            docker_build_ci_unstripped_digest="${{ steps.docker_build_ci_unstripped.outputs.digest }}"
            image_name="acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${docker_build_ci_unstripped_digest/:/-}.sbom"
            docker_build_ci_unstripped_sbom_digest="sha256:$(docker buildx imagetools inspect --raw ${image_name} | sha256sum | head -c 64)"
            cosign sign -y "acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci@${docker_build_ci_unstripped_sbom_digest}"
          fi

      - name: CI Image Releases digests
        shell: bash
        run: |
          mkdir -p image-digest/
          # shellcheck disable=SC2078
          if [ ${{ github.event_name == 'push' && !startsWith(github.ref_name, 'ft/') }} ]; then
            echo "acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.floating_tag }}@${{ steps.docker_build_ci.outputs.digest }}" > image-digest/${{ matrix.name }}.txt
          fi
          echo "acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}@${{ steps.docker_build_ci.outputs.digest }}" >> image-digest/${{ matrix.name }}.txt
          if [[ "${{ steps.docker_build_ci_detect_race_condition.outcome }}" != 'skipped' ]]; then
            echo "acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-race@${{ steps.docker_build_ci_detect_race_condition.outputs.digest }}" >> image-digest/${{ matrix.name }}.txt
          fi
          if [[ "${{ steps.docker_build_ci_unstripped.outcome }}" != 'skipped' ]]; then
            echo "acnpublic.azurecr.io/${{ needs.setup.outputs.quay-organization-dev }}/${{ matrix.name }}-ci:${{ steps.tag.outputs.tag }}-unstripped@${{ steps.docker_build_ci_unstripped.outputs.digest }}" >> image-digest/${{ matrix.name }}.txt
          fi

      # Upload artifact digests
      - name: Upload artifact digests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-digest ${{ matrix.name }}
          path: image-digest
          retention-days: 1

  image-digests:
    if: ${{ always() }}
    name: Display Digests
    runs-on: ubuntu-24.04
    needs: build-and-push-prs
    steps:
      - name: Downloading Image Digests
        shell: bash
        run: |
          mkdir -p image-digest/

      - name: Download digests of all images built
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          path: image-digest/
          pattern: "*image-digest *"

      - name: Image Digests Output
        shell: bash
        run: |
          cd image-digest/
          find -type f | sort | xargs -d '\n' cat

  ### ACN CHANGES ###
  trigger-tests:
    if: ${{ always() && needs.build-and-push-prs.result == 'success' }}
    name: Trigger Test Workflows
    runs-on: ubuntu-24.04
    needs: [build-and-push-prs, image-digests]
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.context-ref || github.sha }}
          persist-credentials: false

      - name: Get SHA and PR info for triggering
        id: trigger-info
        run: |
          if [ "${{ github.event.pull_request.head.sha }}" != "" ]; then
            sha=${{ github.event.pull_request.head.sha }}
            pr_number=${{ github.event.pull_request.number }}
            context_ref=${{ github.head_ref }}
          else
            sha=${{ github.sha }}
            pr_number=""
            context_ref=${{ github.ref }}
          fi
          echo sha=${sha} >> $GITHUB_OUTPUT
          echo pr_number=${pr_number} >> $GITHUB_OUTPUT
          echo context_ref=${context_ref} >> $GITHUB_OUTPUT

      - name: Trigger Smoke Test
        run: |
          gh workflow run tests-smoke.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Smoke Test with IPv6
        run: |
          gh workflow run tests-smoke-ipv6.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Conformance K8s Network Policies
        run: |
          gh workflow run conformance-k8s-network-policies.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger K8s Network E2E tests and kube-apiserver HA
        run: |
          gh workflow run k8s-kind-network-e2e.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger K8s Network Policy E2E tests
        run: |
          gh workflow run k8s-kind-network-policies-e2e.yaml \
            --ref ${{ steps.trigger-info.outputs.context_ref }} \
            --field SHA="${{ steps.trigger-info.outputs.sha }}" \
            --field PR-number="${{ steps.trigger-info.outputs.pr_number }}" \
            --field context-ref="${{ steps.trigger-info.outputs.context_ref }}" \
            --field extra-args='{"triggered_by": "acn-image-ci-build"}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
