name: Smoke Test with IPv6

# Any change in triggers needs to be reflected in the concurrency group.
on:
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      UID:
        description: "A second number, to differentiate multiple runs of the same workflow by the same PR"
        required: false
        default: 1
      context-ref:
        description: "Context in which the workflow runs. If PR is from a fork, will be the PR target branch (general case). If PR is NOT from a fork, will be the PR branch itself (this allows committers to test changes to workflows directly from PRs)."
        required: true
      SHA:
        description: "SHA under test (head of the PR branch)."
        required: true
      base-SHA:
        description: "SHA of the base branch (target branch of the PR)."
        required: false
      run-id:
        description: "Run ID of the workflow that uploaded the kubeconfig artifact"
        required: false
        default: ''
      extra-args:
        description: "[JSON object] Arbitrary arguments passed from the trigger comment via regex capture group. Parse with 'fromJson(inputs.extra-args).argName' in workflow."
        required: false
        default: '{}'
  push:
    branches:
      - v1.19
      - ft/v1.19/**

permissions:
  ### ACN CHANGE ###
  # Need statuses to report back to PR
  # Need actions:read to download artifacts from other workflow runs
  # To be able to request the JWT from GitHub's OIDC provider
  id-token: write
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: |
    ${{ github.workflow }}
    ${{ github.event_name }}
    ${{
      (github.event_name == 'push' && github.sha) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.PR-number) ||
      (github.event_name == 'pull_request' && github.event.number)
    }}
  cancel-in-progress: true

env:
  KIND_CONFIG: .github/kind-config-ipv6.yaml
  # Skip external traffic (e.g. 1.1.1.1 and www.google.com) due to no support for IPv6 in github action
  CONFORMANCE_TEMPLATE: examples/kubernetes/connectivity-check/connectivity-check-internal.yaml
  TIMEOUT: 5m
  LOG_TIME: 30m

jobs:
  echo-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Echo Workflow Dispatch Inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Echo Workflow Dispatch Inputs
        run: |
          echo '${{ tojson(inputs) }}'
      - name: Echo Concurrency Group
        run: |
          echo "Current concurrency group:"
          echo "${{ github.workflow }}"
          echo "${{ github.event_name }}"
          echo "${{
            (github.event_name == 'push' && github.sha) ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.PR-number) ||
            (github.event_name == 'pull_request' && github.event.number)
          }}"
          echo "Full concurrency group: ${{ github.workflow }}-${{ github.event_name }}-${{
            (github.event_name == 'push' && github.sha) ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.PR-number) ||
            (github.event_name == 'pull_request' && github.event.number)
          }}"

  commit-status-start:
    name: Commit Status Start
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Set initial commit status
        uses: cilium/cilium/.github/actions/set-commit-status@main # main
        with:
          sha: ${{ inputs.SHA || github.sha }}

  ### Separate job for external (AKS) clusters ###
  # This job runs the actual smoke tests against a pre-existing AKS cluster,
  # just runs the conformance validation.
  conformance-test-external:
    env:
      job_name: "Test on External Cluster"
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run-id != '' }}
    runs-on: ubuntu-latest
    name: Test on External Cluster
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.SHA || github.sha }}
          persist-credentials: false

      - name: Download kubeconfig artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubeconfig
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run conformance test (e.g. connectivity check without external 1.1.1.1 and www.google.com)
        run: |
          kubectl apply -f ${{ env.CONFORMANCE_TEMPLATE }}
          kubectl wait --for=condition=Available --all deployment --timeout=${{ env.TIMEOUT }}

      - name: Report status to PR
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.PR-number }}
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const contextName = 'Smoke Test with IPv6 / AKS External Cluster';
            const description = state === 'success'
              ? 'Smoke Test with IPv6 passed on AKS'
              : 'Smoke Test with IPv6 failed on AKS';

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: '${{ inputs.SHA }}',
              state: state,
              context: contextName,
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  ### END CHANGE ###

  conformance-test-ipv6:
    env:
      job_name: "Conformance Smoke Test with IPv6"
    runs-on: ubuntu-24.04
    name: Installation and Conformance Test (ipv6)
    steps:
      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false

      - name: Checkout (trusted)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ inputs.context-ref || github.event.repository.default_branch }}

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables

      - name: Get Cilium's default values
        id: default_vars
        uses: ./.github/actions/helm-default
        with:
          image-tag: ${{ inputs.SHA || github.event.pull_request.head.sha || github.sha }}
          registry_host: ${{ vars.DOCKER_READ_HOST }}
          registry_organization: ${{ vars.DOCKER_READ_ORG }}
          image-pull-secret: "cilium-registry"
          chart-dir: ./untrusted/install/kubernetes/cilium

      - name: Set image tag
        id: sha
        run: |
          echo sha=${{ steps.default_vars.outputs.sha }} >> $GITHUB_OUTPUT

      - name: Precheck generated connectivity manifest files
        run: |
          make -C examples/kubernetes/connectivity-check fmt
          make -C examples/kubernetes/connectivity-check all
          test -z "$(git status --porcelain)" || (echo "please run 'make -C examples/kubernetes/connectivity-check fmt all' and submit your changes"; exit 1)

      - name: Enable IPv6 in docker
        run: |
          sudo cat /etc/docker/daemon.json || true
          # Keep existing config like cgroup-parent in github action
          sudo sh -c "echo '{ \"exec-opts\": [\"native.cgroupdriver=cgroupfs\"], \"cgroup-parent\": \"/actions_job\", \"ipv6\": true, \"fixed-cidr-v6\": \"2001:db8:1::/64\" }' > /etc/docker/daemon.json"
          sudo cat /etc/docker/daemon.json
          sudo ip -6 route add 2001:db8:1::/64 dev docker0
          sudo sysctl net.ipv6.conf.default.forwarding=1
          sudo sysctl net.ipv6.conf.all.forwarding=1
          sudo systemctl restart docker

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_K8S_IMAGE }}
          kubectl_version: ${{ env.KIND_K8S_VERSION }}
          config: ${{ env.KIND_CONFIG }}
          wait: 0 # The control-plane never becomes ready, since no CNI is present

      - name: Create imagePullSecret
        run: |
          kubectl create secret docker-registry cilium-registry \
            --namespace kube-system \
            --docker-server=${{ vars.DOCKER_READ_HOST }} \
            --docker-username="${{ vars.DOCKER_READ_USERNAME }}" \
            --docker-password="${{ secrets.DOCKER_READ_PASSWORD }}"

      - name: Login to docker registry for image wait
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ vars.DOCKER_READ_HOST}}
          username: ${{ vars.DOCKER_READ_USERNAME}}
          password: ${{ secrets.DOCKER_READ_PASSWORD }}

      - name: Wait for images to be available
        timeout-minutes: 30
        shell: bash
        run: |
          for image in cilium-ci operator-generic-ci hubble-relay-ci ; do
            until docker manifest inspect ${{ vars.DOCKER_READ_HOST }}/${{ vars.DOCKER_READ_ORG }}/$image:${{ steps.sha.outputs.sha }} &> /dev/null; do sleep 45s; done
          done

      - name: Set up install variables
        id: vars
        run: |
          CILIUM_INSTALL_DEFAULTS="${{ steps.default_vars.outputs.cilium_install_defaults }} \
            --helm-set nodeinit.enabled=true \
            --helm-set kubeProxyReplacement=true \
            --helm-set ipam.mode=kubernetes \
            --helm-set hubble.enabled=true \
            --helm-set hubble.relay.enabled=true \
            --helm-set ipv6.enabled=true \
            --helm-set ipv4.enabled=false \
            --helm-set routingMode=native \
            --helm-set autoDirectNodeRoutes=true \
            --helm-set ipv6NativeRoutingCIDR=2001:db8:1::/64 \
            --helm-set ingressController.enabled=true"

          echo cilium_install_defaults=${CILIUM_INSTALL_DEFAULTS} >> $GITHUB_OUTPUT

      - name: Install Cilium CLI
        uses: cilium/cilium-cli@e391e739db83a8b888ecf18786af6853c51a0c58 # v0.19.5
        with:
          skip-build: ${{ env.CILIUM_CLI_SKIP_BUILD }}
          image-repo: ${{ env.CILIUM_CLI_IMAGE_REPO }}
          image-tag: ${{ steps.sha.outputs.sha }}
          repository: ${{ env.CILIUM_CLI_RELEASE_REPO }}
          release-version: ${{ env.CILIUM_CLI_VERSION }}

      # Warning: since this is a privileged workflow, subsequent workflow job
      # steps must take care not to execute untrusted code.
      - name: Checkout pull request branch (NOT TRUSTED)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.vars.outputs.sha }}
          persist-credentials: false
          path: untrusted
          sparse-checkout: |
            install/kubernetes/cilium

      - name: Install Cilium
        id: install-cilium
        run: |
          cilium install ${{ steps.vars.outputs.cilium_install_defaults }}

      - name: Wait for Cilium status to be ready
        run: |
          cilium status --wait --interactive=false
          kubectl -n kube-system get pods

      - name: Run conformance test (e.g. connectivity check without external 1.1.1.1 and www.google.com)
        id: run-tests
        run: |
          kubectl apply -f ${{ env.CONFORMANCE_TEMPLATE }}
          kubectl wait --for=condition=Available --all deployment --timeout=${{ env.TIMEOUT }}

      - name: Run common post steps
        if: ${{ always() && steps.install-cilium.outcome != 'skipped' }}
        uses: ./.github/actions/post-logic
        with:
          artifacts_suffix: "${{ env.job_name }}"
          job_status: "${{ job.status }}"
          capture_features_tested: ${{ steps.run-tests.outcome != 'skipped' }}

      - name: Report status to PR
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.PR-number }}
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const contextName = 'Smoke Test with IPv6';
            const description = state === 'success' ? 'Smoke Test with IPv6 passed' : 'Smoke Test with IPv6 failed';

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: '${{ inputs.SHA }}',
              state: state,
              context: contextName,
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });

  merge-upload-and-status:
    name: Merge Upload and Status
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs:
      - conformance-test-ipv6
      - conformance-test-external
    uses: ./.github/workflows/common-post-jobs.yaml
    secrets: inherit
    with:
      context-ref: ${{ inputs.context-ref || github.sha }}
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.conformance-test-ipv6.result != 'failure' && (needs.conformance-test-external.result == 'success' || needs.conformance-test-external.result == 'skipped') }}