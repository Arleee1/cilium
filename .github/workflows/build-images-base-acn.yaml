name: ACN Base Image Build

# Any change in triggers needs to be reflected in the concurrency group.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - dev/*
    paths:
      - images/runtime/**
      - images/builder/**
      - images/Makefile.acn
      - images/scripts/acn-build-image.sh
  push:
    branches:
      - dev/*
    paths:
      - images/runtime/**
      - images/builder/**
      - images/Makefile.acn
      - images/scripts/acn-build-image.sh
  schedule:
    # Every Sunday at midnight UTC to ensure base images are present for the week.
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  # To be able to access the repository with `actions/checkout`
  contents: read
  # Required for Azure OIDC authentication
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and Push Base Images
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@0ad4b8fadaa221de15dcec353f45205ec38ea70b # v4.1.4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cleanup Disk space in runner
        uses: ./.github/actions/disk-cleanup

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb # v3.3.0
        with:
          driver-opts: |
            image=mcr.microsoft.com/oss/moby/buildkit:0.11.6-2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_BUILD_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login -n acnpublic.azurecr.io

      - name: Build and Push Runtime Image
        working-directory: images
        run: |
          make -f Makefile.acn acn-runtime-image \
            ACN_REGISTRIES=acnpublic.azurecr.io/cilium \
            PUSH=true

      - name: Build and Push Builder Image
        working-directory: images
        run: |
          make -f Makefile.acn acn-builder-image \
            ACN_REGISTRIES=acnpublic.azurecr.io/cilium \
            PUSH=true
