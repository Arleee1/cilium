name: Cyclonus Network Policy Test

on:
  push:
    branches:
      - v1.19
      - ft/v1.19/**
    paths-ignore:
      - 'Documentation/**'
  workflow_dispatch:
    inputs:
      PR-number:
        description: "Pull request number."
        required: true
      context-ref:
        description: "Context in which the workflow runs. If PR is from a fork, will be the PR target branch (general case). If PR is NOT from a fork, will be the PR branch itself (this allows committers to test changes to workflows directly from PRs)."
        required: true
      SHA:
        description: "SHA under test (head of the PR branch)."
        required: true
      run-id:
        description: "Run ID of the workflow that uploaded the kubeconfig artifact"
        required: false
        default: ''
      extra-args:
        description: "[JSON object] Arbitrary arguments passed from the trigger comment via regex capture group. Parse with 'fromJson(inputs.extra-args).argName' in workflow."
        required: false
        default: '{}'

permissions:
  ### ACN CHANGE ###
  # Need statuses to report back to PR
  # Need actions:read to download artifacts from other workflow runs
  actions: read
  contents: read
  # For Azure OIDC authentication to pull test images from ACR
  id-token: write
  pull-requests: read
  statuses: write

env:
  KIND_CONFIG: .github/kind-config.yaml
  CONFORMANCE_TEMPLATE: examples/kubernetes/connectivity-check/connectivity-check.yaml
  TIMEOUT: 2m
  LOG_TIME: 30m

concurrency:
  # Structure:
  # - Workflow name
  # - Event type
  # - A unique identifier depending on event type:
  #   - schedule: SHA
  #   - workflow_dispatch: PR number
  #
  # This structure ensures a unique concurrency group name is generated for each
  # type of testing, such that re-runs will cancel the previous run.
  group: |
    ${{ github.workflow }}
    ${{ github.event_name }}
    ${{
      (github.event_name == 'push' && github.sha) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.PR-number) ||
      (github.event_name == 'pull_request' && github.event.number)
    }}
  cancel-in-progress: true


jobs:
  echo-inputs:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Echo Workflow Dispatch Inputs
    runs-on: ubuntu-24.04
    steps:
      - name: Echo Workflow Dispatch Inputs
        run: |
          echo '${{ tojson(inputs) }}'
      - name: Echo Concurrency Group
        run: |
          echo "Current concurrency group:"
          echo "${{ github.workflow }}"
          echo "${{ github.event_name }}"
          echo "${{
            (github.event_name == 'push' && github.sha) ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.PR-number) ||
            (github.event_name == 'pull_request' && github.event.number)
          }}"
          echo "Full concurrency group: ${{ github.workflow }}-${{ github.event_name }}-${{
            (github.event_name == 'push' && github.sha) ||
            (github.event_name == 'workflow_dispatch' && github.event.inputs.PR-number) ||
            (github.event_name == 'pull_request' && github.event.number)
          }}"
  preflight-clusterrole:
    name: Preflight Clusterrole Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check pre-flight clusterrole
        run: |
          cd install/kubernetes/cilium/templates
          echo "Checking for differences between preflight and agent clusterrole"
          diff \
             -I '^[ ]\{2\}name: cilium.*' \
             -I '^Keep file in sync with.*' \
             -I '^  {{- with .Values.annotations }}$' \
             -I '^  {{- with .Values.preflight.annotations }}$' \
             -I '{{- if.*' \
             cilium-agent/clusterrole.yaml \
             cilium-preflight/clusterrole.yaml

  ### Separate job for external (AKS) clusters ###
  # This job runs the cyclonus network policy test against a pre-existing AKS cluster.
  cyclonus-test-external:
    env:
      job_name: "Test on External Cluster"
      KUBECONFIG: ${{ github.workspace }}/kubeconfig
    if: ${{ inputs.run-id != '' }}
    runs-on: ubuntu-latest
    name: Test on External Cluster
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.SHA || github.sha }}
          persist-credentials: false

      - name: Download kubeconfig artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubeconfig
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run cyclonus network policy test
        working-directory: test/k8s/manifests/netpol-cyclonus
        run: ./test-cyclonus.sh

      - name: Report status to PR
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.PR-number }}
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const contextName = 'Cyclonus Network Policy / AKS External Cluster';
            const description = state === 'success'
              ? 'Cyclonus network policy test passed on AKS'
              : 'Cyclonus network policy test failed on AKS';

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: '${{ inputs.SHA }}',
              state: state,
              context: contextName,
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
  ### END CHANGE ###

  cyclonus-test:
    name: Cyclonus Test
    env:
      job_name: "Cyclonus Test"
    runs-on: ubuntu-24.04
    steps:
      - name: Collect Workflow Telemetry
        uses: cilium/workflow-telemetry-action@b1a318f80a08acede58027afe1455d037379966f # v2.2.0
        with:
          comment_on_pr: false

      - name: Checkout target branch to access local actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ### ACN CHANGE ###
          # We want to always pull from the branch that queued this workflow when setting variables
          ref: ${{ inputs.context-ref || github.sha }}
          persist-credentials: false

      - name: Set Environment Variables
        uses: ./.github/actions/set-env-variables-acn

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Precheck generated connectivity manifest files
        run: |
          make -C examples/kubernetes/connectivity-check fmt
          make -C examples/kubernetes/connectivity-check all
          test -z "$(git status --porcelain)" || (echo "please run 'make -C examples/kubernetes/connectivity-check fmt all' and submit your changes"; exit 1)

      - name: Set image tag
        id: vars
        run: |
          if [ "${{ github.event.pull_request.head.sha }}" != "" ]; then
            echo tag=${{ github.event.pull_request.head.sha }} >> $GITHUB_OUTPUT
          else
            echo tag=${{ github.sha }} >> $GITHUB_OUTPUT
          fi

      - name: Wait for images to be available
        timeout-minutes: 30
        shell: bash
        run: |
          until docker manifest inspect ${{ env.REGISTRY_DEV }}/${{ env.ORGANIZATION_DEV }}/cilium-ci:${{ steps.vars.outputs.tag }} &> /dev/null; do sleep 45s; done
          until docker manifest inspect ${{ env.REGISTRY_DEV }}/${{ env.ORGANIZATION_DEV }}/operator-generic-ci:${{ steps.vars.outputs.tag }} &> /dev/null; do sleep 45s; done

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_K8S_IMAGE }}
          kubectl_version: ${{ env.KIND_K8S_VERSION }}
          config: ${{ env.KIND_CONFIG }}
          wait: 0 # The control-plane never becomes ready, since no CNI is present

      - name: Install cilium chart
        id: install-cilium
        run: |
          HELM_ARGS="\
            --wait \
            --namespace kube-system \
            --set debug.enabled=true \
            --set debug.verbose=envoy \
            --set-string=extraEnv[0].name=CILIUM_FEATURE_METRICS_WITH_DEFAULTS \
            --set-string=extraEnv[0].value=true \
            --set-string=extraEnv[1].name=CILIUM_INVALID_METRIC_VALUE_DETECTOR \
            --set-string=extraEnv[1].value=true \
            --set-string=extraEnv[2].name=CILIUM_SLOG_DUP_ATTR_DETECTOR \
            --set-string=extraEnv[2].value=true \
            --set-string=extraEnv[3].name=KUBE_CACHE_MUTATION_DETECTOR \
            --set-string=extraEnv[3].value=true \
            --set-string=operator.extraEnv[0].name=CILIUM_FEATURE_METRICS_WITH_DEFAULTS \
            --set-string=operator.extraEnv[0].value=true \
            --set-string=operator.extraEnv[1].name=CILIUM_INVALID_METRIC_VALUE_DETECTOR \
            --set-string=operator.extraEnv[1].value=true \
            --set-string=operator.extraEnv[2].name=CILIUM_SLOG_DUP_ATTR_DETECTOR \
            --set-string=operator.extraEnv[2].value=true \
            --set-string=operator.extraEnv[3].name=KUBE_CACHE_MUTATION_DETECTOR \
            --set-string=operator.extraEnv[3].value=true \
            --set nodeinit.enabled=true \
            --set kubeProxyReplacement=true \
            --set bpf.masquerade=false \
            --set ipam.mode=kubernetes \
            --set image.repository=${{ env.REGISTRY_DEV }}/${{ env.ORGANIZATION_DEV }}/cilium-ci \
            --set image.tag=${{ steps.vars.outputs.tag }} \
            --set image.pullPolicy=IfNotPresent \
            --set image.useDigest=false \
            --set operator.image.repository=${{ env.REGISTRY_DEV }}/${{ env.ORGANIZATION_DEV }}/operator \
            --set operator.image.suffix=-ci \
            --set operator.image.tag=${{ steps.vars.outputs.tag }} \
            --set operator.image.pullPolicy=IfNotPresent \
            --set operator.image.useDigest=false \
            --set prometheus.enabled=true \
            --set operator.prometheus.enabled=true \
            --set hubble.enabled=true \
            --set=hubble.metrics.enabled={dns,drop,tcp,flow,port-distribution,icmp,http}"

          helm install cilium ./install/kubernetes/cilium $HELM_ARGS

          kubectl wait -n kube-system --for=condition=Ready -l app.kubernetes.io/part-of=cilium pod --timeout=5m
          kubectl rollout -n kube-system status deploy/coredns --timeout=5m

          # To make sure that cilium CRD is available (default timeout is 5m)
          # https://github.com/cilium/cilium/blob/main/operator/crd.go#L34
          kubectl wait --for condition=Established crd/ciliumnetworkpolicies.cilium.io --timeout=5m

      - name: Run cyclonus network policy test
        id: run-tests
        working-directory: test/k8s/manifests/netpol-cyclonus
        run: ./test-cyclonus.sh

      - name: Install Cilium CLI
        if: ${{ always() }}
        uses: cilium/cilium-cli@2c40f81b9180be6a5e52b8caf7f1de75202ec0fc # v0.19.4
        with:
          skip-build: ${{ env.CILIUM_CLI_SKIP_BUILD }}
          image-repo: ${{ env.CILIUM_CLI_IMAGE_REPO }}
          image-tag: ${{ steps.vars.outputs.tag }}
          repository: ${{ env.CILIUM_CLI_RELEASE_REPO }}
          release-version: ${{ env.CILIUM_CLI_VERSION }}

      - name: Wait for Cilium to be ready
        if: ${{ always() }}
        run: |
          kubectl wait -n kube-system --for=condition=Ready -l app.kubernetes.io/part-of=cilium pod --timeout=5m

      - name: Run common post steps
        if: ${{ always() && steps.run-tests.outcome != 'skipped' }}
        uses: ./.github/actions/post-logic
        with:
          artifacts_suffix: "${{ env.job_name }}"
          job_status: "${{ job.status }}"
          junits-directory: 'test/k8s/manifests/netpol-cyclonus/cyclonus-results'

      - name: Report status to PR
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.PR-number }}
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const contextName = 'Cyclonus Network Policy Test';
            const description = state === 'success' ? 'Cyclonus Network Policy Test passed' : 'Cyclonus Network Policy Test failed';

            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: '${{ inputs.SHA }}',
              state: state,
              context: contextName,
              description: description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });