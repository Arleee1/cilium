trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - dev/*
  paths:
    include:
      - .pipelines/orchestrator-trigger.yaml
      - .pipelines/orchestrator/check-adapters.json

variables:
  DisableDockerDetector: true
  DisableKubernetesDeploymentDetector: true
  DisableHelmChartsDetector: true
  NUGET_PLUGIN_HANDSHAKE_TIMEOUT_IN_SECONDS: 40
  NUGET_PLUGIN_REQUEST_TIMEOUT_IN_SECONDS: 300
  NUGET_PLUGIN_IDLE_TIMEOUT_IN_SECONDS: 1200
  mingwurl: https://github.com/niXman/mingw-builds-binaries/releases/download/12.1.0-rt_v10-rev3/x86_64-12.1.0-release-posix-seh-rt_v10-rev3.7z
  ESRP_XSIGN_MAX_PARALLELIZATION: 100
  DEBIAN_FRONTEND: noninteractive
  LinuxContainerImage: mcr.microsoft.com/onebranch/azurelinux/build:3.0

resources:
  repositories:
  - repository: Templates
    type: git
    name: OneBranch.Pipelines/GovernedTemplates
    ref: refs/heads/main
  - repository: Pipeline-Source
    type: github
    endpoint: Azure Container Networking - Proxima azure-networking
    name: azure-networking/cilium-private
    ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@Templates
  parameters:
    featureFlags:
      automaticContainerPatching: true
      needExceptionForUbuntuUsage: true
      policy: Microsoft
      runHostSDL: true
    globalSdl:
      binSkim:
        enabled: false
      codeql:
        compiled:
          enabled: false
      credscan:
        enabled: true
      suppression:
        suppressionFile: $(Build.SourcesDirectory)\.gdn\.gdnsuppress
        suppressionSet: default
      tsa:
        enabled: false
    stages:
    - template: /.pipelines/orchestrator-validation/stage.yaml@Pipeline-Source
