trigger: none

parameters:
  - name: validateOnly
    type: boolean
    default: false
  - name: pipelineRef
    type: string
    default: refs/heads/main
  - name: sourceRef
    type: string
    default: auto
  - name: sourceSha
    type: string
    default: auto
  - name: mode
    type: string
    default: auto
  - name: refreshBase
    type: boolean
    default: false
  - name: invocation
    type: string
    default: auto

pr:
  autoCancel: true
  branches:
    include:
      - dev/v1.19

variables:
  DEBIAN_FRONTEND: noninteractive
  DisableDockerDetector: true
  DisableKubernetesDeploymentDetector: true
  DisableHelmChartsDetector: true
  TRIVY_VERSION: v0.69.3
  LinuxContainerImage: onebranch.azurecr.io/linux/ubuntu-2404:latest

resources:
  repositories:
    - repository: Templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
    - repository: Cilium-Private
      type: github
      endpoint: Azure Container Networking - Proxima azure-networking
      name: azure-networking/cilium-private
      ref: refs/heads/main
    - repository: Pipeline-Source
      type: github
      endpoint: Azure Container Networking - Proxima azure-networking
      name: azure-networking/cilium-private
      ref: ${{ parameters.pipelineRef }}

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@Templates
  parameters:
    featureFlags:
      automaticContainerPatching: true
      needExceptionForUbuntuUsage: true
      policy: Microsoft
      runHostSDL: true
    globalSdl:
      binSkim:
        enabled: false
      codeql:
        compiled:
          enabled: false
      credscan:
        enabled: false
      tsa:
        enabled: false
    stages:
      - template: /.pipelines/images/acn/stages.yaml@Pipeline-Source
        parameters:
          ciliumVersion: "1.19"
          sourceRef: ${{ parameters.sourceRef }}
          sourceSha: ${{ parameters.sourceSha }}
          mode: ${{ parameters.mode }}
          refreshBase: ${{ parameters.refreshBase }}
          invocation: ${{ parameters.invocation }}
          validateOnly: ${{ parameters.validateOnly }}
