trigger:
  branches:
    include:
      - patch-bump/*
  tags:
    include:
      - core/v*

schedules:
  - cron: "*/30 * * * *"
    displayName: Resume patch-bump orchestration
    branches:
      include:
        - patch-bump/*
    always: true

pr: none

parameters:
  - name: orchestratorBranch
    displayName: Networking-ACN-Agent branch
    type: string
    default: refs/heads/main

variables:
  EXPECTED_PIPELINE_IDS: "389854"
  MANAGED_PIPELINE_IDS: "389854"
  TRIGGERABLE_PIPELINE_IDS: " "
  PBO_VERDICT_EXEMPT_CHECKS: "GitOps/GitHubPop"
  TRUSTED_CHECK_PROVIDERS: "azure-pipelines,github-actions"
  GITHUB_APP_AZURE_SERVICE_CONNECTION: azure-networking GH App - EMU
  GITHUB_APP_KEY_VAULT: GH-AzureNetworking-KV
  GITHUB_APP_KEY_NAME: gh-app-proxima-prod

resources:
  repositories:
    - repository: ACN-Agent
      type: git
      name: One/Networking-ACN-Agent
      ref: ${{ parameters.orchestratorBranch }}
    - repository: GitHub-App-Source
      type: github
      endpoint: Azure Container Networking - Proxima azure-networking
      name: azure-networking/cilium-private
      ref: refs/heads/main

## Notes
# The shared orchestrator runtime selects Phase 1 or Phase 2 from the source ref.

stages:
  - stage: setup
    displayName: Setup
    jobs:
      - job: auth
        displayName: Authenticate to Proxima
        pool:
          name: Networking-ContainerNetworking-VMSS
        steps:
          - template: /.pipelines/github-app/get-token.yaml@GitHub-App-Source
            parameters:
              repository: GitHub-App-Source
              azureServiceConnection: $(GITHUB_APP_AZURE_SERVICE_CONNECTION)
              keyVaultName: $(GITHUB_APP_KEY_VAULT)
              keyName: $(GITHUB_APP_KEY_NAME)
              githubApiUrl: https://api.msft.ghe.com
              githubOwner: azure-networking
              githubRepository: cilium-private
              githubClientId: Iv23oxCQOO8ZnZHUSIKJ
              githubInstallationId: "7642"
              githubAppSlug: cilium-private-automation
              permissions:
                actions: write
                checks: read
                contents: write
                issues: write
                metadata: read
                pull_requests: write
                statuses: write
                workflows: write
              outputVariable: INSTALL_TOKEN
              outputIsSecretJobOutput: true

      - job: env
        displayName: Setup
        dependsOn: auth
        variables:
          INSTALL_TOKEN: $[ dependencies.auth.outputs['GitHubAppToken.INSTALL_TOKEN'] ]
        # pipeline_runner self-watches the downstream E2E build inside this job
        # (Phase 3 wait loop, up to ~4.5h). Without this, the job inherits the
        # 60-min default timeout and is canceled mid-watch before the build
        # reaches a terminal state, so the judge/retry never runs.
        timeoutInMinutes: 360
        pool:
          name: "$(BUILD_POOL_NAME_DEFAULT)"
        steps:
          - checkout: self
          - checkout: ACN-Agent
            path: s/ACN-Agent
          - script: |
              echo "hello world"
              which openssl
              which base64
              which python3
              python3 --version
            displayName: "Debug: Verify Tools Available"

          - bash: |
              echo "=== Debug: Login Step Environment Variables ==="
              echo "BUILD_SOURCEVERSION:      $(Build.SourceVersion)"
              echo "BUILD_SOURCEBRANCH:       $(Build.SourceBranch)"
              echo "BUILD_REQUESTEDFOR:       $(Build.RequestedFor)"
              echo "BUILD_REASON:             $(Build.Reason)"
              echo "BUILD_DEFINITIONID:       $BUILD_DEFINITIONID"
              echo "STATE_STORAGE_ACCOUNT:    $(STATE_STORAGE_ACCOUNT)"
              echo "STATE_STORAGE_CONTAINER:  $(STATE_STORAGE_CONTAINER)"
              echo "AZURE_OPENAI_ENDPOINT:    $(AZURE_OPENAI_ENDPOINT)"
              echo "AZURE_OPENAI_DEPLOYMENT:  $(AZURE_OPENAI_DEPLOYMENT)"
              echo "ADO_ORG"                  $(System.CollectionUri)
              echo "ADO_PROJECT:              $(System.TeamProject)"
              echo "AZURE_DEVOPS_EXT_PAT set: $([[ -n '$(SYSTEM_ACCESSTOKEN)' ]] && echo 'yes' || echo 'no')"
              echo "GITHUB_TOKEN set:         $([[ -n '$(INSTALL_TOKEN)' ]] && echo 'yes' || echo 'no')"
              echo "GITHUB_REPO:              $(Build.Repository.Name)"
              echo "==============================================="
            displayName: "Debug: Login Step Env Vars"
            env:
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_REQUESTEDFOR: $(Build.RequestedFor)
              BUILD_REASON: $(Build.Reason)
              BUILD_DEFINITIONID: $(System.DefinitionId)
              STATE_STORAGE_CONTAINER: $(STATE_STORAGE_CONTAINER)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
              GITHUB_TOKEN: $(INSTALL_TOKEN)

          - bash: |
              echo "=== Debug: Checkout Directory Structure ==="
              echo "Build.SourcesDirectory: $(Build.SourcesDirectory)"
              echo ""
              echo "--- Top-level contents ---"
              ls -la "$(Build.SourcesDirectory)/"
              echo ""
              echo "--- ACN-Agent contents ---"
              ls -la "$(Build.SourcesDirectory)/ACN-Agent/" || echo "dir not found"
              echo ""
              echo "--- orchestrator contents ---"
              ls -la "$(Build.SourcesDirectory)/ACN-Agent/cilium-private-release-orchestrator/orchestrator/" || echo "dir not found"
              echo ""
              echo "--- Confirming key files exist ---"
              [[ -f "$(Build.SourcesDirectory)/ACN-Agent/cilium-private-release-orchestrator/orchestrator/requirements.txt" ]] \
                && echo "✅ requirements.txt found" || echo "❌ requirements.txt NOT found"
              [[ -f "$(Build.SourcesDirectory)/ACN-Agent/cilium-private-release-orchestrator/orchestrator/bootstrap.py" ]] \
                && echo "✅ bootstrap.py found" || echo "❌ bootstrap.py NOT found"
              echo "==========================================="
            displayName: "Debug: Repo Directory Structure"

          - task: AzureCLI@2
            displayName: "Login"
            inputs:
              azureSubscription: $(BUILD_VALIDATIONS_SERVICE_CONNECTION)
              scriptLocation: "inlineScript"
              scriptType: "bash"
              workingDirectory: "$(Build.SourcesDirectory)"
              inlineScript: |
                export BUILD_SOURCEVERSION="$(Build.SourceVersion)"
                export BUILD_SOURCEBRANCH="$(Build.SourceBranch)"
                export BUILD_REQUESTEDFOR="$(Build.RequestedFor)"
                export BUILD_REASON="$(Build.Reason)"
                ORCH_DIR="$(Build.SourcesDirectory)/ACN-Agent/cilium-private-release-orchestrator/orchestrator"
                echo "ORCH_DIR: $ORCH_DIR"
                echo "Agent outbound IP: $(curl -sf https://api.ipify.org)" # Added due to potential NSP blocks.
                python3 -m ensurepip --upgrade
                python3 -m pip install --user -r "$ORCH_DIR/requirements.txt"
                python3 "$ORCH_DIR/bootstrap.py"
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              BUILD_SOURCEVERSION: $(Build.SourceVersion)
              BUILD_SOURCEBRANCH: $(Build.SourceBranch)
              BUILD_REQUESTEDFOR: $(Build.RequestedFor)
              BUILD_REASON: $(Build.Reason)
              BUILD_DEFINITIONID: $(System.DefinitionId)
              STATE_STORAGE_ACCOUNT: $(STATE_STORAGE_ACCOUNT)
              STATE_STORAGE_CONTAINER: $(STATE_STORAGE_CONTAINER)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_OPENAI_DEPLOYMENT: $(AZURE_OPENAI_DEPLOYMENT)
              GITHUB_TOKEN: $(INSTALL_TOKEN)
              GITHUB_REPO: $(Build.Repository.Name)
              GITHUB_REPOSITORY_URI: $(Build.Repository.Uri)
              ADO_ORG: $(System.CollectionUri)
              ADO_PROJECT: $(System.TeamProject)
              CILIUM_BUILD_PIPELINE_ID: "371023"
              CILIUM_RELEASE_PIPELINE_ID: "427658"
              ORCHESTRATOR_BRANCH: ${{ parameters.orchestratorBranch }}
              EXPECTED_PIPELINE_IDS: $(EXPECTED_PIPELINE_IDS)
              MANAGED_PIPELINE_IDS: $(MANAGED_PIPELINE_IDS)
              TRIGGERABLE_PIPELINE_IDS: $(TRIGGERABLE_PIPELINE_IDS)
              PBO_VERDICT_EXEMPT_CHECKS: $(PBO_VERDICT_EXEMPT_CHECKS)
              TRUSTED_CHECK_PROVIDERS: $(TRUSTED_CHECK_PROVIDERS)
              PYTHONUNBUFFERED: "1"
